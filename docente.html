<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Docente - Tecnología 12</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <!-- 1. FORMULARIO DE LOGIN -->
    <div id="seccion-login" class="max-w-md mx-auto my-12 bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-xl">
        <h2 class="text-2xl font-bold text-center text-cyan-400 mb-6">Iniciar Sesión Docente</h2>
        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Correo Electrónico</label>
                <input type="email" id="login-email" value="ariel.aguirre@bue.edu.ar" required class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
                <input type="password" id="login-password" required class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500">
            </div>
            <p id="mensaje-error-login" class="text-red-400 text-xs hidden"></p>
            <button type="submit" id="btn-login" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2.5 rounded transition">
                Ingresar al Panel
            </button>
        </form>
    </div>

    <!-- 2. PANEL DE CARGA -->
    <div id="seccion-panel" class="max-w-4xl mx-auto hidden">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-cyan-400">Panel Docente</h1>
                <p class="text-slate-400 text-sm">Sesión: <span id="user-email" class="text-cyan-300"></span></p>
            </div>
            <div class="flex gap-2">
                <a href="index.html" class="text-xs bg-slate-800 hover:bg-slate-700 text-cyan-400 px-3 py-2 rounded border border-cyan-500/30 transition">
                    ← Volver al Sitio
                </a>
                <button id="btn-logout" class="text-xs bg-red-900/60 hover:bg-red-800 text-red-200 px-3 py-2 rounded transition">
                    Cerrar Sesión
                </button>
            </div>
        </header>

        <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-xl mb-12">
            <h2 class="text-xl font-bold mb-4 text-slate-200">Cargar Nuevo Proyecto / Multimedia</h2>
            
            <form id="form-proyecto" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Título</label>
                    <input type="text" id="input-titulo" required class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Año / Curso</label>
                        <select id="input-anio" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500">
                            <option value="1º Año">1º Año</option>
                            <option value="2º Año">2º Año</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Tipo de Contenido</label>
                        <select id="select-tipo" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500">
                            <option value="imagen">Imágenes (Vercel Proxy)</option>
                            <option value="video">Video (YouTube)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Descripción</label>
                    <textarea id="input-descripcion" rows="3" required class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500"></textarea>
                </div>

                <div id="campo-imagen">
                    <label class="block text-sm font-medium text-slate-300 mb-1">Seleccionar Imagen(es) <span class="text-xs text-cyan-400 font-normal">(Máx. 4.4 MB por foto)</span></label>
                    <input type="file" id="input-archivo" accept="image/*" multiple class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500">
                </div>

                <div id="campo-video" class="hidden">
                    <label class="block text-sm font-medium text-slate-300 mb-1">URL del Video de YouTube</label>
                    <input type="url" id="input-url-video" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-slate-100 focus:outline-none focus:border-cyan-500">
                </div>

                <button type="submit" id="btn-subir" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition duration-200">
                    Publicar Proyecto
                </button>
            </form>
        </section>

        <!-- LISTA DE GESTIÓN -->
        <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-slate-200">Proyectos Publicados</h2>
            <div id="lista-gestion" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <p class="col-span-full text-slate-500 text-center py-4">Cargando publicaciones...</p>
            </div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // URL del Endpoint en Vercel. Si este HTML se ejecuta hospedado dentro de Vercel, basta utilizar '/api/upload'.
        // Si el HTML se ejecuta hospedado en GitHub Pages, debes sustituir la constante con el dominio de Vercel
        // (Ejemplo: "https://tu-proyecto.vercel.app/api/upload").
        const VERCEL_UPLOAD_ENDPOINT = "/api/upload";

        const firebaseConfig = {
            apiKey: "AIzaSyAL4AqHuOKmo2YT7VTxwii1zyDS-8YDE98",
            authDomain: "tecno-del-12.firebaseapp.com",
            projectId: "tecno-del-12",
            storageBucket: "tecno-del-12.firebasestorage.app",
            messagingSenderId: "377657972511",
            appId: "1:377657972511:web:2dd32d978647a23c2ec22a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const seccionLogin = document.getElementById("seccion-login");
        const seccionPanel = document.getElementById("seccion-panel");
        const userEmailSpan = document.getElementById("user-email");

        onAuthStateChanged(auth, (user) => {
            if (user) {
                seccionLogin.classList.add("hidden");
                seccionPanel.classList.remove("hidden");
                userEmailSpan.textContent = user.email;
                cargarPublicaciones();
            } else {
                seccionLogin.classList.remove("hidden");
                seccionPanel.classList.add("hidden");
            }
        });

        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;
            const errorMsg = document.getElementById("mensaje-error-login");
            const btnLogin = document.getElementById("btn-login");

            btnLogin.disabled = true;
            btnLogin.textContent = "Ingresando...";
            errorMsg.classList.add("hidden");

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                errorMsg.textContent = "Credenciales inválidas. Verifica tu contraseña.";
                errorMsg.classList.remove("hidden");
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = "Ingresar al Panel";
            }
        });

        document.getElementById("btn-logout").addEventListener("click", () => signOut(auth));

        const selectTipo = document.getElementById("select-tipo");
        const campoImagen = document.getElementById("campo-imagen");
        const campoVideo = document.getElementById("campo-video");

        selectTipo.addEventListener("change", () => {
            if (selectTipo.value === "imagen") {
                campoImagen.classList.remove("hidden");
                campoVideo.classList.add("hidden");
            } else {
                campoImagen.classList.add("hidden");
                campoVideo.classList.remove("hidden");
            }
        });

        function sanitizar(texto) {
            if (!texto) return "";
            return texto.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function obtenerEmbedYouTube(url) {
            if (!url) return "";
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|shorts\/)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? `https://www.youtube.com/embed/${match[2]}` : url;
        }

        const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Subida segura mediante el Backend de Vercel
        async function subirImagenServidor(archivo) {
            // Validar límite de 4.4 MB en frontend antes de enviar la petición a la Serverless Function
            const LIMITE_BYTES = 4.4 * 1024 * 1024;
            if (archivo.size > LIMITE_BYTES) {
                throw new Error(`El archivo "${archivo.name}" pesa ${(archivo.size / (1024 * 1024)).toFixed(2)} MB y excede el límite máximo permitido por Vercel (4.5 MB).`);
            }

            const formData = new FormData();
            formData.append("image", archivo);

            const res = await fetch(VERCEL_UPLOAD_ENDPOINT, {
                method: "POST",
                body: formData
            });

            const data = await res.json();

            if (!res.ok || !data.success) {
                throw new Error(data.error || "Fallo en el servidor al procesar la imagen.");
            }

            return data.url;
        }

        document.getElementById("form-proyecto").addEventListener("submit", async (e) => {
            e.preventDefault();

            const titulo = document.getElementById("input-titulo").value.trim();
            const descripcion = document.getElementById("input-descripcion").value.trim();
            const anio = document.getElementById("input-anio").value;
            const tipoMedia = selectTipo.value;
            const inputArchivo = document.getElementById("input-archivo");
            const inputUrlVideo = document.getElementById("input-url-video");
            const btnSubir = document.getElementById("btn-subir");

            btnSubir.disabled = true;

            try {
                if (tipoMedia === "imagen") {
                    const archivos = inputArchivo.files;

                    if (archivos.length === 0) {
                        alert("Por favor seleccioná al menos una imagen.");
                        btnSubir.disabled = false;
                        return;
                    }

                    let subidasConExito = 0;

                    for (let i = 0; i < archivos.length; i++) {
                        const archivo = archivos[i];
                        btnSubir.textContent = `Procesando foto ${i + 1} de ${archivos.length}...`;

                        const urlImagen = await subirImagenServidor(archivo);
                        const tituloFinal = archivos.length > 1 ? `${titulo} (${i + 1})` : titulo;

                        await addDoc(collection(db, "proyectos_tecno"), {
                            titulo: tituloFinal,
                            descripcion: descripcion,
                            anio: anio,
                            tipo: "imagen",
                            urlMedia: urlImagen,
                            fechaCreacion: new Date()
                        });

                        subidasConExito++;
                        if (i < archivos.length - 1) await esperar(300);
                    }

                    alert(`¡Se publicaron exitosamente las ${subidasConExito} imágenes!`);

                } else if (tipoMedia === "video") {
                    const urlVideoRaw = inputUrlVideo.value.trim();
                    if (!urlVideoRaw) {
                        alert("Por favor ingresá la URL del video de YouTube.");
                        btnSubir.disabled = false;
                        return;
                    }

                    btnSubir.textContent = "Guardando video...";
                    const embedUrl = obtenerEmbedYouTube(urlVideoRaw);

                    await addDoc(collection(db, "proyectos_tecno"), {
                        titulo: titulo,
                        descripcion: descripcion,
                        anio: anio,
                        tipo: "video",
                        urlMedia: embedUrl,
                        fechaCreacion: new Date()
                    });

                    alert("¡Video publicado exitosamente!");
                }

                document.getElementById("form-proyecto").reset();
                selectTipo.dispatchEvent(new Event("change"));
                cargarPublicaciones();

            } catch (error) {
                console.error("Error al publicar:", error);
                alert("Ocurrió un error: " + error.message);
            } finally {
                btnSubir.disabled = false;
                btnSubir.textContent = "Publicar Proyecto";
            }
        });

        async function cargarPublicaciones() {
            const contenedor = document.getElementById("lista-gestion");
            contenedor.innerHTML = `<p class="col-span-full text-slate-500 text-center py-4">Cargando...</p>`;

            try {
                let snapshot;
                try {
                    const q = query(collection(db, "proyectos_tecno"), orderBy("fechaCreacion", "desc"));
                    snapshot = await getDocs(q);
                } catch (e) {
                    snapshot = await getDocs(collection(db, "proyectos_tecno"));
                }

                if (snapshot.empty) {
                    contenedor.innerHTML = `<p class="col-span-full text-slate-500 text-center py-4">No hay contenido publicado.</p>`;
                    return;
                }

                contenedor.innerHTML = snapshot.docs.map(docSnap => {
                    const data = docSnap.data();
                    let miniatura = "";

                    if (data.tipo === "imagen") {
                        miniatura = `<img src="${data.urlMedia}" alt="${sanitizar(data.titulo)}" class="w-20 h-20 object-cover rounded border border-slate-700 flex-shrink-0">`;
                    } else {
                        miniatura = `
                            <div class="w-20 h-20 bg-slate-950 rounded border border-slate-700 flex items-center justify-center flex-shrink-0 text-red-500 font-bold text-xs">
                                ▶ Video
                            </div>`;
                    }

                    return `
                        <div class="flex items-center gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700 shadow">
                            ${miniatura}
                            <div class="flex-grow min-w-0">
                                <h3 class="font-bold text-slate-100 text-sm truncate">${sanitizar(data.titulo)}</h3>
                                <p class="text-xs text-slate-400">${sanitizar(data.anio)} — ${data.tipo.toUpperCase()}</p>
                            </div>
                            <button onclick="eliminarProyecto('${docSnap.id}')" class="bg-red-600/80 hover:bg-red-500 text-white text-xs px-3 py-2 rounded transition flex-shrink-0">
                                Eliminar
                            </button>
                        </div>
                    `;
                }).join("");
            } catch (error) {
                console.error("Error al cargar publicaciones:", error);
                contenedor.innerHTML = `<p class="col-span-full text-red-400 text-center py-4">Error al obtener las publicaciones.</p>`;
            }
        }

        window.eliminarProyecto = async (id) => {
            if (confirm("¿Estás seguro de que deseas eliminar este proyecto?")) {
                try {
                    await deleteDoc(doc(docSnap => docSnap.id, db, "proyectos_tecno", id));
                } catch (e) {
                    await deleteDoc(doc(db, "proyectos_tecno", id));
                }
                alert("Proyecto eliminado.");
                cargarPublicaciones();
            }
        };
    </script>
</body>
</html>
